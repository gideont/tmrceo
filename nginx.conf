server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Serve the portable article at both /firststone and /firststone/.
    location = /firststone {
        try_files /firststone/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
